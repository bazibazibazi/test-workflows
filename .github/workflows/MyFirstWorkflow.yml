name: My First Workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  first_job:
    name: My first job
    runs-on: ubuntu-latest
        
    steps:
      - name: Checkout
        uses: actions/checkout@v4
     
      - name: Show context
        shell: bash
        run: |
          echo "Hello ${{ vars.WHO_TO_GREET }} from ${{ github.actor }}."
          echo "My secret is ${{ secrets.MY_SECRET }}"
          echo "Current branch is '${{ github.ref }}'."

  Test:
    runs-on: ubuntu-latest
    environment: Test
    needs: first_job
    steps:
      - name: Run tests
        shell: bash
        run: |
          echo "Hello ${{ vars.WHO_TO_GREET }} from ${{ github.actor }}."
          sec=$(echo ${{ secrets.MY_SECRET }} | sed 's/./& /g')
          echo "My secret is ${{ secrets.MY_SECRET }}"
          echo "Current branch is '${{ github.ref }}'."
      
      - name: Verify test results
        shell: bash
        run: |
          echo "Test validation passed"
          # Add your actual test verification logic here
    
  Load-Test:
    runs-on: ubuntu-latest
    environment: Load-Test
    needs: first_job
    steps:
      - name: Run load tests
        shell: bash
        run: |
          echo "Starting load tests..."
          # Add your load test script here
          exit 0
      
      - name: Verify load test results
        shell: bash
        run: |
          echo "Load test validation passed"
          # Add your load test verification logic here

  Production:
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: https://writeabout.net
    needs: [Test, Load-Test]
    if: success()
    
    steps:    
      - name: Checkout
